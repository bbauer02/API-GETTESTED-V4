framework:
    workflows:
        session_lifecycle:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\Session
            initial_marking: DRAFT
            places:
                - DRAFT
                - OPEN
                - LOCKED
                - VALIDATED
                - CANCELLED
            transitions:
                open:
                    from: DRAFT
                    to: OPEN
                lock:
                    from: OPEN
                    to: LOCKED
                validate:
                    from: LOCKED
                    to: VALIDATED
                reopen_from_locked:
                    from: LOCKED
                    to: OPEN
                cancel_from_draft:
                    from: DRAFT
                    to: CANCELLED
                cancel_from_open:
                    from: OPEN
                    to: CANCELLED
                cancel_from_locked:
                    from: LOCKED
                    to: CANCELLED
                reopen:
                    from: CANCELLED
                    to: DRAFT
